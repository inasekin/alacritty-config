  { key = "ц",         mods = "Command", mode = "Alt",             chars = "\u001b[119;9u" },
  { key = "х",         mods = "Command|Shift", mode = "Alt",       chars = "\u001b[91;10u" },
  { key = "ъ",         mods = "Command|Shift", mode = "Alt",       chars = "\u001b[93;10u" },
  { key = "К",         mods = "Control|Shift", mode = "Alt",       chars = "\u001b[114;6u" },
  { key = "к",         mods = "Control|Shift", mode = "Alt",       chars = "\u001b[114;6u" },
  { key = "К",         mods = "Command|Shift",       mode = "Alt", chars = "\u001b[114;10u" },
  { key = "к",         mods = "Command|Shift",       mode = "Alt", chars = "\u001b[114;10u" },
  { key = "Л",         mods = "Command", mode = "Alt",             chars = "\u001b[107;9u" },
  { key = "л",         mods = "Command", mode = "Alt",             chars = "\u001b[107;9u" },
